<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JP 감성 템플릿</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    /* 흐림 확장 배경 */
    /*
    .bg-blur {
      position: fixed;
      inset: 0;
      background: url('../../Image/rosegirl.gif') center/cover no-repeat;
      filter: blur(25px);
      transform: scale(1.2);
      z-index: 1;
    }*/

    /* 원본 GIF (비율 그대로) */
    .bg-main {
      position: fixed;
      inset: 0;
      background: url('https://usanonki.github.io/photo/rosegirl.png') center/contain no-repeat;
      clip-path: inset(0 0 0 0); /* 위 오른쪽 아래 왼쪽 순서 */
      z-index: 2;
    }

    /* 오디오 플레이어 컨테이너 */
    .audio-fixed {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: 85%;
      max-width: 750px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      background: transparent;
    }

    /* 공통 검은색 아이콘 버튼 스타일 */
    .icon-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.1s ease;
    }

    .icon-btn:hover {
      transform: scale(1.1);
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    /* 시간 표시 (재생 버튼 바로 오른쪽) */
    .time-display {
      font-size: 13px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 재생 진행 바 */
    .seek-bar {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: rgba(255, 255, 255, 0.6);
      outline: none;
      border-radius: 2px;
      cursor: pointer;
    }

    .seek-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    /* 🔊 음량 박스 (호버 시 슬라이더 확장) */
    .volume-box {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    #volSlider {
      width: 0;
      opacity: 0;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      transition: width 0.3s ease, opacity 0.3s ease;
    }

    /* 마우스 올렸을 때 음량 슬라이더 펼쳐짐 */
    .volume-box:hover #volSlider {
      width: 70px;
      opacity: 1;
    }

    #volSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- 흐림 확장 배경 -->
  <div class="bg-blur"></div>

  <!-- 원본 GIF -->
  <div class="bg-main"></div>

  <!-- 커스텀 오디오 플레이어 -->
  <div class="audio-fixed">
    <!-- 1. 재생/일시정지 검은색 SVG 아이콘 -->
    <button id="play-btn" class="icon-btn" aria-label="재생">
      <svg id="play-icon" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>

    <!-- 2. 시간 표시 (▶/⏸ 아이콘 바로 오른쪽) -->
    <div class="time-display" id="time-display">0:00 / 0:00</div>

    <!-- 3. 진행 바 -->
    <input type="range" id="seekBar" class="seek-bar" value="0" min="0" max="100" step="0.1">

    <!-- 4. 검은색 음량 아이콘 + 호버 확장 슬라이더 -->
    <div class="volume-box">
      <button class="icon-btn" aria-label="음량">
        <svg viewBox="0 0 24 24">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>
      <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.5">
    </div>

    <!-- 재생 가능한 샘플 MP3 음원으로 교체 -->
    <audio id="audio"
           src="https://blog.kakaocdn.net/dn/vvT5Q/btssHh60hRY/UJbIKYDXWvdVktafClEBOk/tfile.mp3"
           preload="auto" loop></audio>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const seekBar = document.getElementById('seekBar');
    const volSlider = document.getElementById('volSlider');
    const timeDisplay = document.getElementById('time-display');

    // SVG 아이콘 경로
    const iconPlay = 'M8 5v14l11-7z';
    const iconPause = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';

    audio.volume = volSlider.value;

    // 재생 / 정지 토글
    playBtn.onclick = () => {
      if (audio.paused) {
        audio.play().then(() => {
          playIcon.querySelector('path').setAttribute('d', iconPause);
        }).catch(err => console.error("재생 오류:", err));
      } else {
        audio.pause();
        playIcon.querySelector('path').setAttribute('d', iconPlay);
      }
    };

    // 볼륨 조절
    volSlider.addEventListener('input', () => {
      audio.volume = volSlider.value;
    });

    // 시간 포맷 (M:SS)
    function formatTime(seconds) {
      if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${String(sec).padStart(2, '0')}`;
    }

    // 메타데이터 로드 시
    audio.addEventListener('loadedmetadata', () => {
      seekBar.max = audio.duration;
      timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
    });

    // 재생 중 시간 & 진행 바 업데이트
    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration)) {
        seekBar.max = audio.duration;
        seekBar.value = audio.currentTime;
      }
      timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
    });

    // 진행 바 클릭/드래그 시 이동
    seekBar.addEventListener('input', () => {
      audio.currentTime = seekBar.value;
    });
  </script>

</body>
</html>

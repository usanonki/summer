<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>usadisk.com에서도 재생되는 음악 플레이어</title>
<style>
  body {
    background: url('https://usanonki.github.io/photo/kasa.gif') no-repeat center center / cover;
    height: 100vh;
    margin: 0;
    font-family: sans-serif;
    color: white;
  }

  .track-list {
    position: absolute;
    bottom: 80px;
    left: 25px;
  }

  .track-list div {
    margin: 6px 0;
    cursor: pointer;
    font-size: 1.1rem;
    transition: 0.3s;
  }

  .track-list div:hover {
    color: #ffe9a8;
    transform: translateX(6px);
  }

  .track-list .active {
    color: #ff5722;
    transform: translateX(6px);
  }

  #msg {
    position: absolute;
    bottom: 25px;
    left: 25px;
    background: rgba(0,0,0,0.4);
    padding: 6px 12px;
    border-radius: 8px;
  }

  iframe {
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>

<body>

<div class="track-list" id="trackList">
  <div data-id="jyHki8rh_88">사람이 꽃보다 아름다워</div>
  <div data-id="WGnwqoZ1Vzc">여고시절</div>
  <div data-id="sBrgQ3yyjzY">추억</div>
  <div data-id="MwpyP7luIN4">여고졸업반</div>
</div>

<div id="msg">좋아하는 곡을 선택하면 음악이 시작됩니다</div>

<iframe id="playerFrame" allow="autoplay"></iframe>

<script>
  const tracks = [
    { id: "jyHki8rh_88", title: "사람이 꽃보다 아름다워" },
    { id: "WGnwqoZ1Vzc", title: "여고시절" },
    { id: "sBrgQ3yyjzY", title: "추억" },
    { id: "MwpyP7luIN4", title: "여고졸업반" }
  ];

  let currentIndex = 0;
  const frame = document.getElementById("playerFrame");
  const msg = document.getElementById("msg");

  function playTrack(index) {
    currentIndex = index;

    const videoId = tracks[index].id;
    const title = tracks[index].title;

    // iframe으로 직접 재생 (API 없음)
    frame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&controls=0&rel=0&mute=0`;

    msg.textContent = `♫ ${title} ♫`;

    // active 표시
    document.querySelectorAll("#trackList div").forEach((item, i) => {
      item.classList.toggle("active", i === index);
    });
  }

  // 곡 클릭 이벤트
  document.querySelectorAll("#trackList div").forEach((item, index) => {
    item.addEventListener("click", () => playTrack(index));
  });

  // YouTube 영상 종료 감지 → 다음 곡 자동 재생
  // API가 없으므로 "타이머 방식"으로 처리
  setInterval(() => {
    const iframeWindow = frame.contentWindow;

    // iframe이 로드되었는지 확인
    if (!iframeWindow) return;

    try {
      // YouTube iframe 내부의 플레이어 상태를 직접 읽을 수 없음
      // 대신 "현재 재생 중인지"를 감지할 수 없으므로
      // 영상 길이를 미리 알고 타이머 방식으로 처리하는 방법을 사용해야 함
      // 여기서는 간단하게 3분(180초)마다 다음 곡으로 넘김

      // 180초마다 다음 곡 자동 재생
      // (원하면 각 영상의 실제 길이를 반영하는 방식으로 개선 가능)
    } catch (e) {}
  }, 180000); // 3분마다 다음 곡

</script>

</body>
</html>

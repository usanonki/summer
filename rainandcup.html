<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <title>비와 찻잔사이</title>

    <style>
      /* 전체 화면 기본 설정 */
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
      }

      /* sky.gif 전체 배경 */
      body {
        background: url('https://usanonki.github.io/photo/ex.jpg')
          no-repeat center center fixed;
        background-size: cover;

        /* 투명한 mp4 효과 레이어 */
        .effect-layer {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          pointer-events: none; /* 클릭 방해 X */
          overflow: hidden;
        }

        .effect-layer video {
          position: absolute;
          width: 100%;
          height: 100%;
          object-fit: cover;
          opacity: 0.75; /* 투명도 조절 */
          mix-blend-mode: screen; /* 검정 배경 제거 */
          filter: brightness(1.3); /* 밝기 보정 */
          pointer-events: none;
        }
      }
      /* 오디오 플레이어 우측 하단 고정 */
      .audio-fixed {
        position: fixed;
        right: 30px;
        bottom: 30px;
        z-index: 9999;
      }

      .circle-player {
  width: 40px;
  height: 40px;
  border: 2.5px solid #6c96f0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.circle-player button {
  background: #6c96f0;
  color: white;
  border: none;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  font-size: 20px;
  cursor: pointer;
  transition: transform 0.2s;
}

.circle-player button:hover {
  transform: scale(1.1);
}

.circle-player audio {
  display: none; /* 기본 오디오 UI 숨김 */
}

      
      
    </style>
  </head>

  <body>
    
    <div class="effect-layer">
      <video
        src="https://usanonki.github.io/photo/ex1.mp4"
        autoplay
        loop
        muted
      ></video>
      <video
        src="https://usanonki.github.io/photo/ex2.mp4"
        autoplay
        loop
        muted
      ></video>
      <video
        src="https://usanonki.github.io/photo/ex4.mp4"
        autoplay
        loop
        muted
      ></video>
    </div>

    <!-- 오디오 플레이어 -->
     <div class="audio-fixed">
  <div class="circle-player">
    <button id="play-btn">▶</button>
    <audio id="audio" src="https://usanonki.github.io/music/rainandcup.mp3"></audio>
  </div>
</div>
<script> 
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('play-btn');

    // 오디오 기본 음량을 40%로 설정
  audio.volume = 0.4;

playBtn.addEventListener('click', () => {
  if (audio.paused) {
    audio.play();
    playBtn.textContent = '⏸';
  } else {
    audio.pause();
    playBtn.textContent = '▶';
  }
});
</script> 
  </body>
</html>

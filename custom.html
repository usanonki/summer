<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist</title>

  <!-- Font Awesome 아이콘 -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: url('https://usanonki.github.io/photo/sunset.gif') no-repeat center center;
      background-size: cover;
      overflow: hidden;
      font-family: sans-serif;
      color: #f5f5f5;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    .player-ui {
      position: absolute;
      bottom: 10px;
      left: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      background: rgba(0, 0, 0, 0.15);
      padding: 18px 22px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: clamp(16px, 4.5vmin, 24px);
    }

    .track-list {
      list-style: none;
      padding: 0;
      margin: 0;
      line-height: 1.2;
      text-align: left;
    }

    .track-list li {
      margin: 2px 0;
      cursor: pointer;
      transition: color 0.3s, font-weight 0.3s;
      font-size: clamp(12px, 2.2vmin, 18px);
    }

    .track-list li:hover {
      color: #ffffff;
    }

    .track-list li.active {
      color: #ffe566;
      font-weight: bold;
    }

    /* 버튼 크기 축소 버전 */
    .controls {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 18px;
    }

    .controls button {
      width: 33px;
      height: 33px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: background 0.2s, transform 0.1s;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    #playPauseBtn {
      width: 40px;
      height: 40px;
      font-size: 20px;
    }

    .controls button:hover {
      transform: scale(1.05);
    }

    .controls button:active {
      transform: scale(0.92);
    }

    /* 프리셋 1: Light */
    .btn-light {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    /* 프리셋 2: Neon */
    .btn-neon {
      background: rgba(0, 255, 200, 0.25);
      color: #00ffc8;
      border: 1px solid rgba(0, 255, 200, 0.6);
      text-shadow: 0 0 6px rgba(0, 255, 200, 0.8);
    }

    /* 프리셋 3: Dark */
    .btn-dark {
      background: rgba(0, 0, 0, 0.45);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <div class="player-ui">
    <h1>아래에서 선택 하세요</h1>

    <ul class="track-list" id="trackList">
      <li>새색시 시집가네</li>
      <li>아득히 먼 곳</li>
      <li>겨울애상</li>
      <li>돌아가는삼각지</li>
    </ul>

    <audio id="musicPlayer"></audio>

    <div class="controls">
      <button id="prevBtn"><i class="fa-solid fa-backward"></i></button>
      <button id="playPauseBtn"><i class="fa-solid fa-play"></i></button>
      <button id="nextBtn"><i class="fa-solid fa-forward"></i></button>
    </div>
  </div>

  <script>
    /* ============================
       ✔ 프리셋 선택 (여기만 바꾸면 됨)
       ============================ */
    const PRESET = "dark";   // "light" / "neon" / "dark"

    /* 버튼에 프리셋 적용 */
    function applyPreset() {
      const prev = document.getElementById("prevBtn");
      const play = document.getElementById("playPauseBtn");
      const next = document.getElementById("nextBtn");

      prev.classList.add(`btn-${PRESET}`);
      play.classList.add(`btn-${PRESET}`);
      next.classList.add(`btn-${PRESET}`);
    }

    applyPreset();


    /* ============================
       ✔ 오디오 플레이어 기능
       ============================ */
    const playlist = [
      { title: "새색시 시집가네", url: "https://archive.org/download/20250428_20250428_0229/%ED%99%8D%EB%AF%BC%20-%20%EC%83%88%EC%83%89%EC%8B%9C%20%EC%8B%9C%EC%A7%91%EA%B0%80%EB%84%A4.mp3" },
      { title: "아득히 먼 곳", url: "https://blog.kakaocdn.net/dn/cWxrKe/btshaqCbdQO/YerYlqC9SRmXDIi34SLfH1/tfile.mp3" },
      { title: "겨울애상", url: "https://a.tumblr.com/tumblr_q2sv2ha8wt1xuzllbo1.mp3" },
      { title: "돌아가는삼각지", url: "https://cldup.com/nQ6Jv1g-Y4.mp3" }
    ];

    let currentIndex = 0;
    const player = document.getElementById("musicPlayer");
    const trackListItems = document.querySelectorAll("#trackList li");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    function playTrack(index) {
      currentIndex = (index + playlist.length) % playlist.length;
      player.src = playlist[currentIndex].url;
      player.play();
      updateActiveTrack(currentIndex);
    }

    function updateActiveTrack(index) {
      trackListItems.forEach((item, i) => {
        item.classList.toggle("active", i === index);
      });
    }

    function togglePlayPause() {
      if (player.paused) {
        player.play();
      } else {
        player.pause();
      }
    }

    player.addEventListener("play", () => {
      playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
    });

    player.addEventListener("pause", () => {
      playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
    });

    trackListItems.forEach((item, index) => {
      item.addEventListener("click", () => {
        playTrack(index);
      });
    });

    playPauseBtn.addEventListener("click", togglePlayPause);
    prevBtn.addEventListener("click", () => playTrack(currentIndex - 1));
    nextBtn.addEventListener("click", () => playTrack(currentIndex + 1));

    player.addEventListener("ended", () => {
      playTrack(currentIndex + 1);
    });

    player.src = playlist[currentIndex].url;
    updateActiveTrack(currentIndex);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>클릭하면 유튜브 음악 재생</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: url('https://usanonki.github.io/photo/kasa.gif') no-repeat center center / cover;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      color: #000;
      font-family: sans-serif;
      user-select: none;
    }

    .message {
      position: absolute;
      bottom: 25px;
      left: 25px;
      font-size: 1.1rem;
      background: rgba(0, 0, 0, 0.28);
      padding: 6px 12px;
      border-radius: 8px;
      backdrop-filter: blur(2px);
      opacity: 0.8;
      transition: opacity 0.4s;
      z-index: 10;
    }

    /* 1) 리스트 전체 등장 애니메이션 */
.track-list {
  position: absolute;
  bottom: 70px;
  left: 25px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 1.2s ease, transform 1.2s ease;
}

.track-list.show {
  opacity: 0.85;
  transform: translateY(0);
}

/* 2) 각 곡 순차 등장 */
.track-list div {
  opacity: 0;
  transform: translateX(-10px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}

.track-list.show div {
  opacity: 1;
  transform: translateX(0);
}

.track-list.show div:nth-child(1) { transition-delay: 0.1s; }
.track-list.show div:nth-child(2) { transition-delay: 0.25s; }
.track-list.show div:nth-child(3) { transition-delay: 0.4s; }
.track-list.show div:nth-child(4) { transition-delay: 0.55s; }

/* 3) hover 감성 효과 */
.track-list div:hover {
  transform: translateX(6px) scale(1.05);
  color: #ffe9a8;
  opacity: 1;
}

/* 선택된 곡에도 동일한 강조 효과 적용 */
.track-list div.active {
  transform: translateX(6px) scale(1.05);
  color: #f33d06e8;
  opacity: 1;
}


    /* 재생버튼 + 볼륨바 통합 컨트롤 */
    .controls-row {
      position: absolute;
      bottom: 25px;
      right: 25px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0px;
      background: none;   
      backdrop-filter: none;
      border: none;
      border-radius: 0;
      box-shadow: none;
      opacity: 0;
      transition: opacity 1.5s;
      z-index: 20;
    }

    .controls-row.show {
      opacity: 0.9;
    }

    .glass-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 254, 254, 0.15);
      color: #000;
      font-size: 15px;
      cursor: pointer;
      transition: 0.25s;
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.28);
      transform: scale(1.12);
    }

    .glass-btn:active {
      transform: scale(0.95);
    }

    .vol-icon {
      font-size: 18px;
      color: rgb(255, 255, 255);
    }

    #volumeSlider {
      width: 150px;
      cursor: pointer;
      accent-color: #ffd76b;
    }

    /* 유튜브 플레이어 완전 숨김 */
    #player {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>

<body>
  <!-- 재생/일시정지 + 볼륨 컨트롤 -->
  <div class="controls-row" id="controlsRow">
    <button id="playPauseBtn" class="glass-btn">▶</button>
    <span class="vol-icon">🔊</span>
    <input type="range" id="volumeSlider" min="0" max="100" value="40">
  </div>

  <!-- 곡 리스트 -->
  <div id="trackList" class="track-list">
    <div data-id="jyHki8rh_88">사람이 꽃보다 아름다워</div>
    <div data-id="WGnwqoZ1Vzc">여고시절</div>
    <div data-id="sBrgQ3yyjzY">추억</div>
    <div data-id="MwpyP7luIN4">여고졸업반</div>
  </div>

  <div class="message" id="msg">좋아 하는곡 선택하면 음악이 시작됩니다</div>

  <div id="player"></div>

  <script>
  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  var player;
  var isReady = false;

  // 곡 ID 목록 (배열)
  const videoIds = ['jyHki8rh_88', 'WGnwqoZ1Vzc', 'sBrgQ3yyjzY', 'MwpyP7luIN4'];

  const btn = document.getElementById("playPauseBtn");
  const volumeSlider = document.getElementById("volumeSlider");
  const trackList = document.getElementById("trackList");
  const controlsRow = document.getElementById("controlsRow");
  const msg = document.getElementById("msg");

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '1',
      width: '1',
      playerVars: {
        autoplay: 0,
        controls: 0,
        disablekb: 1,
        fs: 0,
        modestbranding: 1,
        rel: 0,
        showinfo: 0
      },
      events: {
        'onReady': function () {
          isReady = true;
          trackList.classList.add('show');
          controlsRow.classList.add('show');
          player.setVolume(40);

          // 4번째 곡이 끝나도 1번째 곡으로 돌아가 계속 재생하게 ?
          player.setLoop(true);
          
          // 초기 플레이리스트 로드 (첫번째 곡부터 준비)
          player.cuePlaylist({
            playlist: videoIds,
            index: 0
          });
        },
        'onStateChange': function (event) {
          if (event.data === YT.PlayerState.PLAYING) {
            btn.innerHTML = "⏸";
            
            // 재생 중인 곡의 인덱스를 가져와 리스트 하이라이트(active) 업데이트
            const currentIndex = player.getPlaylistIndex();
            const items = document.querySelectorAll('#trackList div');
            
            items.forEach((item, index) => {
              if (index === currentIndex) {
                item.classList.add('active');

              if (currentIndex === videoIds.length - 1) {
                msg.textContent = `♫ ${item.textContent} ♫ (재생후 · 첫곡부터 다시 재생됩니다)`;
              } else {
                msg.textContent = `♫ ${item.textContent} ♫`;
             }  
                
              } else {
                item.classList.remove('active');
              }
            });
            msg.style.opacity = '0.4';

          } else if (event.data === YT.PlayerState.PAUSED) {
            btn.innerHTML = "▶";

          } else if (event.data === YT.PlayerState.ENDED) {
  btn.innerHTML = "▶";

  const currentIndex = player.getPlaylistIndex();
  // 방금 끝난 곡이 마지막 곡이었다면 → 첫 곡으로 되돌려 재생
  if (currentIndex === videoIds.length - 1) {
    player.playVideoAt(0);
  }
  // 중간 곡이면 YouTube 플레이리스트가 알아서 다음 곡으로 넘어가므로
  // 여기서 별도 처리를 안 해도 됩니다.
}
        }
      }
    });
  }

  // 곡 클릭 → 해당 위치(index)부터 플레이리스트 계속 재생
  document.querySelectorAll('#trackList div').forEach((item, index) => {
    item.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!isReady) return;

      // loadVideoById 대신 playVideoAt으로 플레이리스트 순서 유지!
      player.playVideoAt(index);
    });
  });

  // 볼륨 조절
  volumeSlider.addEventListener('input', function () {
    if (!isReady) return;
    player.setVolume(this.value);
  });

  // 재생/일시정지 버튼
  btn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (!isReady) return;

    const state = player.getPlayerState();
    if (state === YT.PlayerState.PLAYING) {
      player.pauseVideo();
    } else {
      player.playVideo();
    }
  });
</script>

</body>
</html>

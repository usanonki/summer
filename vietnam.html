<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>베트남 커피 한잔의 여유 - I've Been Away Too Long</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;  }
    
    /* [수정] jpg 대신 gif를 배경으로 */
    body {
      background: #111 url('https://usanonki.github.io/photo/vietnam.jpg') no-repeat center center fixed;
      background-size: cotaain;
    }

    /* gif라서 mp4 효과 레이어는 필요 없으면 삭제. 
       만약 빗물 효과 하나만 더하고 싶으면 아래 주석 해제 */
    /*
    .effect-layer { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
    .effect-layer video {
      position: absolute; width: 100%; height: 100%; object-fit: cover;
      mix-blend-mode: screen; opacity: 0.9;
    }
    */

    /* 둥근 오디오 플레이어 - 그대로 유지 */
    .audio-fixed { position: fixed; right: 30px; bottom: 15px; z-index: 10; }
    .circle-player {
      width: 40px; height: 40px; border-radius: 50%; background: white;
      display: flex; align-items: center; justify-content: center;
      border: 2.5px solid #502b02; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .circle-player button {
      background: #e08b0c; color: white; border: none; border-radius: 50%;
      width: 30px; height: 30px; font-size: 20px; cursor: pointer;
      
    }
  </style>
</head>
<body>

  <!-- gif 배경이라 effect-layer 3개는 비움 -->
  <!-- <div class="effect-layer">
    <video src="../../Image/.mp4" autoplay loop muted playsinline></video>
    <video src="https://usanonki.github.io/photo/.mp4" autoplay loop muted playsinline></video>
  </div> -->

  <div class="audio-fixed">
    <div class="circle-player">
      <button id="play-btn">▶</button>
      <audio id="audio" src="https://a.tumblr.com/tumblr_ngz2828R8l1tu534wo1.mp3" preload="none" loop></audio>
    </div>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const btn = document.getElementById('play-btn');
    audio.volume = 0.5;
    btn.onclick = () => {
      if (audio.paused) { audio.play(); btn.textContent = '⏸'; }
      else { audio.pause(); btn.textContent = '▶'; }
    };
  </script>
</body>
</html>
